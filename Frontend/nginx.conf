# =============================================================================
# Nginx del Frontend - RaspberryPros
# 1. Sirve el bundle estatico de React.
# 2. Hace de reverse proxy hacia los tres microservicios, replicando las mismas
#    rutas que usaba el proxy de Vite en desarrollo.
# Los nombres "usuarios", "productos" y "ventas" los resuelve el DNS interno de
# la red de Docker Compose.
# =============================================================================

upstream usuarios_api  { server usuarios:3001; }
upstream productos_api { server productos:3002; }
upstream ventas_api    { server ventas:3003; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion basica: en una Raspberry Pi ahorra bastante ancho de banda.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API de Usuarios / Autenticacion ----------
    location /usuarios-api/ {
        proxy_pass http://usuarios_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # ---------- API de Productos ----------
    location /productos-api/ {
        proxy_pass http://productos_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- API de Ventas ----------
    location /ventas-api/ {
        proxy_pass http://ventas_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Cache larga para los assets con hash en el nombre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: cualquier ruta desconocida devuelve el index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
